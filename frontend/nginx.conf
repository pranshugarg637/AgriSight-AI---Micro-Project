server {
  listen 80;
  root /usr/share/nginx/html;

  # The service worker must always be re-checked so updates roll out.
  location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location /models/ { add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }
  types { application/wasm wasm; application/manifest+json webmanifest; }

  # SPA routes (/farmer, /account/...)
  location / { try_files $uri /index.html; }
}
